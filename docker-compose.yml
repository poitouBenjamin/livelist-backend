services:
  postgres:
    image: postgres:16
    container_name: livelist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: livelist
      POSTGRES_PASSWORD: livelist_dev_password
      POSTGRES_DB: livelist
    ports:
      - "5432:5432"
    volumes:
      - livelist_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: livelist-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  livelist_postgres_data:
